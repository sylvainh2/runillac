<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Run'illac</title>

    <script>
        (function () {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            sessionStorage.setItem(
                "redirect",
                path + search + hash
            );

            window.location.replace("/runillac/");
        })();
    </script>
</head>
<body>
</body>
</html>
